<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        First name <br>
        <input type="text" name="Firstname" placeholder="isi nama" > <br/>
        Lastname <br/>
        <input type="text" name="Lastname" value="Mickey"> <br/> <br> 
        <textarea name="message" rows="10" cols="30">Pala bapak kao</textarea><br/>
        <input type="date" name="date"> <br/>
        favorite color <br>
        <input type="text" list="colors" name="color"> 
        <datalist id="colors">
            <option value="Red">
            <option value="Green">
            <option value="Blue">
            <option value="Yellow">
            <option value="Black">
            <option value="White">
        </datalist> <br>
        <input type="tel" maxlength="12" size="25" name="text" required> <br/>
        <input type="submit" value="Submit" />  
    </form>
    <input type="radio" name="gender" value="male" checked> Male <br>
    <input type="radio" name="gender" value="female"> Female <br>
</body>
</html>
